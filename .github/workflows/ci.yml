name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository, and the unit job executes whatever the tree
# contains — so the token is narrowed rather than left at the repository default.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless; the artifact job rewrites
# source files to prove the packer normalises line endings, so overlapping runs are worse than
# useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"
      - name: Lint
        run: ruff check .

  unit:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --target .testlibs -r tests/requirements-test.txt
      # Python 3.10 has no tomllib, so this matrix also exercises the plugin's regex reader
      # for Forge/NeoForge metadata instead of only the parser every 3.11+ interpreter takes.
      # The real-MCDR end-to-end is excluded here because it needs a real MCDR boot (about 2 m
      # 20 s on its own) and is run by the `e2e` job below — not by the matrix job, which does
      # not invoke pytest at all and therefore never ran these two cases.
      - name: Run the suite
        run: PYTHONPATH=.testlibs python -m pytest -m "not e2e"

  e2e:
    # The two end-to-end cases are in no other job: `unit` excludes them by marker, `mutation`
    # only runs the files its selectors name, and `mcdr-matrix` drives its own scenario without
    # pytest. So "827 passed, including 2 end-to-end" was a claim CI never checked. This job is
    # that check — one real MCDR boot, the packed plugin, the whole flow.
    name: end-to-end (real MCDR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --target .testlibs -r tests/requirements-test.txt
      - name: Boot a real MCDR and drive the plugin through it
        run: PYTHONPATH=.testlibs python -m pytest tests/test_e2e.py -q
      - name: Upload the console when it fails
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: e2e-console
          path: |
            /tmp/pytest-of-*/**
            /tmp/muc_e2e_*/**
          if-no-files-found: ignore

  python-floor:
    # `ruff.toml` sets target-version = py38 because that is MCDR 2.13.0's floor, but a config
    # file is not a check and no job above runs an interpreter that old. This job is the check:
    # every file must parse as 3.8 and use no newer annotation or standard-library name.
    name: Python 3.8 floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Every file still runs on the declared floor
        run: python tools/check_python_floor.py

  mutation:
    # The suite passing is not the same as the suite having teeth. Each mutation below breaks one
    # guard in a temporary copy of the repository and must be caught by the tests named with it.
    name: mutation check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --target .testlibs -r tests/requirements-test.txt
      - name: Every mutation must be caught by at least one test
        run: python tools/mutation_check.py

  mcdr-matrix:
    # The headline claim is "works on MCDR 2.13.0 and newer", and it is only worth anything if
    # it is tested against real MCDR releases rather than asserted. One job per version, each
    # booting an actual MCDR with a fake Minecraft server and a fake upstream, then driving the
    # automatic check and every command including the alias.
    name: real MCDR ${{ matrix.mcdr }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mcdr: ["2.13.0", "2.14.1", "2.15.0", "2.15.7", "2.16.0"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install MCDR ${{ matrix.mcdr }} and pytest
        run: python -m pip install --target .testlibs "mcdreforged==${{ matrix.mcdr }}" pytest
      - name: Load the packed plugin, run a check, and drive every command
        run: PYTHONPATH=.testlibs python tools/mcdr_matrix.py --current
      - name: Upload the MCDR console when it fails
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mcdr-${{ matrix.mcdr }}-console
          path: /tmp/muc_matrix_work_*/**
          if-no-files-found: ignore

  artifact:
    # `.mcdr` is built from the tag and attached to a release, so "rebuild it from the source
    # and compare the hash" has to actually work. The packer pins zip timestamps, permissions
    # and line endings for exactly that reason; this job is what keeps it true.
    name: the artifact is reproducible and loadable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Pack twice, compare, and inspect
        run: python tools/check_artifact.py
