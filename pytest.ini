[pytest]
testpaths = tests
# ``e2e`` boots a real MCDR instance and takes about 2 minutes 20 seconds (the whole suite is
# about 146 s, measured); it is worth running before a release and not worth running on every
# save.
markers =
    e2e: boots a real MCDR instance (slow, ~2 m 20 s measured)
addopts = -q
